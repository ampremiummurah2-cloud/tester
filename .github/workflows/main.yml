name: sigit monitoring

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

env:
  TIMEOUT: 180
  RETRY_DELAY: 20
  MAX_RETRIES: 3

jobs:
  multi-ping:
    name: Advanced Multi-Space Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Advanced Multi-Method Ping with Full Detection
        id: ping
        continue-on-error: true
        run: |
          echo "======================================================================"
          echo "MULTI-METHOD GUARDIAN PRO v3.0"
          echo "======================================================================"
          echo "Waktu: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Mode: Full Detection + Redirect Follower"
          echo ""

          SPACES=(
            "https://sigitganteng-zerobot.hf.space/"
            "https://sigitganteng-bot.hf.space/"
          )

          METHODS=("HEAD" "GET" "POST" "IFRAME" "HEALTH")
          FINAL_STATUS=()

          for SPACE_URL in "${SPACES[@]}"; do
            echo "======================================================================"
            echo "TARGET SPACE: $SPACE_URL"
            echo "======================================================================"

            SPACE_NAME=$(echo "$SPACE_URL" | sed -E 's|https?://([^/]+).*|\1|')
            echo "Space Name: $SPACE_NAME"

            SUCCESS=false
            STATUS_HISTORY=()

            for METHOD in "${METHODS[@]}"; do
              echo ""
              echo "----------------------------------------------------------------------"
              echo "Method: $METHOD"
              echo "----------------------------------------------------------------------"

              case $METHOD in
                "HEAD")
                  RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                    -H "User-Agent: GitHub-Actions-Guardian-Pro/3.0" \
                    -I "$SPACE_URL" 2>/dev/null)
                  ;;
                "GET")
                  RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time ${{ env.TIMEOUT }} \
                    -H "User-Agent: GitHub-Actions-Guardian-Pro/3.0" \
                    -L "$SPACE_URL" 2>/dev/null)
                  ;;
                "POST")
                  RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                    -X POST \
                    -H "User-Agent: GitHub-Actions-Guardian-Pro/3.0" \
                    -H "Content-Type: application/json" \
                    -d '{"ping":"keepalive"}' \
                    "$SPACE_URL" 2>/dev/null)
                  ;;
                "IFRAME")
                  RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                    -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                    -H "Accept: text/html" \
                    "$SPACE_URL" 2>/dev/null)
                  ;;
                "HEALTH")
                  RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                    "$SPACE_URL/api/health" 2>/dev/null || echo "404")
                  ;;
              esac

              STATUS_HISTORY+=("$METHOD:$RESPONSE")
              echo "HTTP Status: $RESPONSE"

              if [[ $RESPONSE =~ ^2[0-9][0-9]$ ]] || [[ $RESPONSE == "206" ]]; then
                echo "SUCCESS: Space is active (Status $RESPONSE)"
                SUCCESS=true
                break
              fi

              if [[ $RESPONSE == "503" ]] || [[ $RESPONSE == "504" ]]; then
                echo "Cold start detected, waiting ${{ env.RETRY_DELAY }} seconds..."
                sleep ${{ env.RETRY_DELAY }}
              fi

              if [[ $RESPONSE =~ ^3[0-9][0-9]$ ]]; then
                echo "Redirect detected, following..."
                REDIRECT_URL=$(curl -s -o /dev/null -w "%{redirect_url}" "$SPACE_URL" 2>/dev/null)
                echo "Redirect to: $REDIRECT_URL"
              fi
            done

            echo ""
            echo "----------------------------------------------------------------------"
            echo "SUMMARY FOR $SPACE_NAME"
            echo "----------------------------------------------------------------------"
            for STATUS in "${STATUS_HISTORY[@]}"; do
              echo "  - $STATUS"
            done

            if [ "$SUCCESS" = true ]; then
              echo "STATUS: SPACE ACTIVE"
              FINAL_STATUS+=("$SPACE_NAME: ACTIVE")
            else
              echo "STATUS: FAILED"
              FINAL_STATUS+=("$SPACE_NAME: FAILED")
            fi
            echo "----------------------------------------------------------------------"
          done

          echo "======================================================================"
          echo "FINAL SUMMARY - ALL SPACES"
          echo "======================================================================"
          for STATUS in "${FINAL_STATUS[@]}"; do
            echo "  $STATUS"
          done
          echo "======================================================================"

      - name: Generate Summary Report
        if: always()
        run: |
          echo "# Multi-Method Guardian Pro - Monitoring Report" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date '+%Y-%m-%d %H:%M:%S %Z') |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Spaces | 2 |" >> $GITHUB_STEP_SUMMARY
          echo "| Methods | HEAD, GET, POST, IFRAME, HEALTH |" >> $GITHUB_STEP_SUMMARY
          echo "| Timeout | 180 seconds |" >> $GITHUB_STEP_SUMMARY
          echo "| Max Retries | 3 per method |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Space Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Space | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| zerobot | ${{ steps.ping.outputs.space_zerobot_status || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| bot | ${{ steps.ping.outputs.space_bot_status || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
