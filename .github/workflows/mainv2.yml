name: sigit monitoring v2

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  TIMEOUT: 180
  RETRY_DELAY: 20
  MAX_RETRIES: 2

jobs:
  multi-ping:
    name: Advanced Multi-Space Guardian v2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Advanced Multi-Method Ping with Auto-Timeot
        id: ping
        continue-on-error: true
        run: |
          echo "======================================================================"
          echo "MULTI-METHOD GUARDIAN PRO v4.2 - AUTO TIMEOUT"
          echo "======================================================================"
          echo "Waktu: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Mode: Full Detection + Redirect Follower + Auto Timeout"
          echo ""

          SPACES=(
            "https://sigitganteng-monitor.hf.space/"
          )

          METHODS=("HEAD" "GET" "POST" "IFRAME" "HEALTH")
          FINAL_REPORT=()

          TOTAL_DOMAINS=${#SPACES[@]}
          TIMEOUT_PER_DOMAIN=180
          TOTAL_TIMEOUT=$((TOTAL_DOMAINS * TIMEOUT_PER_DOMAIN))
          BUFFER=60
          JOB_TIMEOUT=$((TOTAL_TIMEOUT + BUFFER))

          echo "📊 Jumlah domain: $TOTAL_DOMAINS"
          echo "⏱️ Total timeout otomatis: $((JOB_TIMEOUT / 60)) menit"
          echo ""

          for SPACE_URL in "${SPACES[@]}"; do
            echo "======================================================================"
            echo "🎯 TARGET SPACE: $SPACE_URL"
            echo "======================================================================"

            SPACE_NAME=$(echo "$SPACE_URL" | sed -E 's|https?://([^/]+).*|\1|')
            echo "📦 Space Name: $SPACE_NAME"

            SUCCESS=false
            STATUS_HISTORY=()
            SKIP=false

            DOMAIN_START=$(date +%s)
            DOMAIN_TIMEOUT=180

            for METHOD in "${METHODS[@]}"; do
              CURRENT_TIME=$(date +%s)
              ELAPSED=$((CURRENT_TIME - DOMAIN_START))

              if [ $ELAPSED -ge $DOMAIN_TIMEOUT ]; then
                echo "⏰ Waktu 3 menit habis untuk domain ini!"
                echo "⏭️ Skip ke domain berikutnya..."
                SKIP=true
                break
              fi

              if [ "$SUCCESS" = true ]; then
                break
              fi

              echo ""
              echo "----------------------------------------------------------------------"
              echo "📡 Method: $METHOD (Sisa waktu: $((DOMAIN_TIMEOUT - ELAPSED)) detik)"
              echo "----------------------------------------------------------------------"

              REMAINING=$((DOMAIN_TIMEOUT - ELAPSED))
              if [ $REMAINING -gt 30 ]; then
                CURL_TIMEOUT=30
              else
                CURL_TIMEOUT=$REMAINING
              fi

              case $METHOD in
                "HEAD")
                  RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time $CURL_TIMEOUT \
                    -H "User-Agent: GitHub-Actions-Guardian-Pro/4.2" \
                    -I "$SPACE_URL" 2>/dev/null)
                  ;;
                "GET")
                  RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time $CURL_TIMEOUT \
                    -H "User-Agent: GitHub-Actions-Guardian-Pro/4.2" \
                    -L "$SPACE_URL" 2>/dev/null)
                  ;;
                "POST")
                  RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time $CURL_TIMEOUT \
                    -X POST \
                    -H "User-Agent: GitHub-Actions-Guardian-Pro/4.2" \
                    -H "Content-Type: application/json" \
                    -d '{"ping":"keepalive"}' \
                    "$SPACE_URL" 2>/dev/null)
                  ;;
                "IFRAME")
                  RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time $CURL_TIMEOUT \
                    -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                    -H "Accept: text/html" \
                    "$SPACE_URL" 2>/dev/null)
                  ;;
                "HEALTH")
                  RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time $CURL_TIMEOUT \
                    "$SPACE_URL/api/health" 2>/dev/null || echo "404")
                  ;;
              esac

              STATUS_HISTORY+=("$METHOD:$RESPONSE")
              echo "📡 HTTP Status: $RESPONSE"

              if [[ $RESPONSE =~ ^2[0-9][0-9]$ ]] || [[ $RESPONSE == "206" ]]; then
                echo "✅ SUCCESS: Space is active (Status $RESPONSE)"
                SUCCESS=true
                break
              fi

              if [[ $RESPONSE == "404" ]]; then
                echo "⚠️ 404 Not Found - Mungkin Space sedang build"
                continue
              fi

              if [[ $RESPONSE == "503" ]] || [[ $RESPONSE == "504" ]]; then
                echo "⏳ Cold start detected, waiting 20 seconds..."
                sleep 20
              fi

              if [[ $RESPONSE =~ ^3[0-9][0-9]$ ]]; then
                echo "🔄 Redirect detected, following..."
                REDIRECT_URL=$(curl -s -o /dev/null -w "%{redirect_url}" "$SPACE_URL" 2>/dev/null)
                echo "📍 Redirect to: $REDIRECT_URL"
              fi

            done

            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - DOMAIN_START))
            if [ $ELAPSED -ge $DOMAIN_TIMEOUT ] && [ "$SUCCESS" = false ]; then
              SKIP=true
            fi

            echo ""
            echo "----------------------------------------------------------------------"
            echo "📋 SUMMARY FOR $SPACE_NAME"
            echo "----------------------------------------------------------------------"
            echo "⏱️ Total waktu: $ELAPSED detik"
            for STATUS in "${STATUS_HISTORY[@]}"; do
              echo "  - $STATUS"
            done

            if [ "$SUCCESS" = true ]; then
              echo "✅ STATUS: SPACE ACTIVE"
              FINAL_REPORT+=("$SPACE_NAME: ✅ ACTIVE")
            elif [ "$SKIP" = true ]; then
              echo "⏭️ STATUS: TIMEOUT/SKIPPED"
              FINAL_REPORT+=("$SPACE_NAME: ⏭️ TIMEOUT")
            else
              echo "❌ STATUS: FAILED"
              FINAL_REPORT+=("$SPACE_NAME: ❌ FAILED")
            fi
            echo "----------------------------------------------------------------------"
          done

          echo "======================================================================"
          echo "📊 FINAL SUMMARY - ALL SPACES"
          echo "======================================================================"
          for REPORT in "${FINAL_REPORT[@]}"; do
            echo "  $REPORT"
          done
          echo "======================================================================"

      - name: Generate Summary Report
        if: always()
        run: |
          echo "# 🚀 Multi-Method Guardian Pro v4.2 - Monitoring Report" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date '+%Y-%m-%d %H:%M:%S %Z') |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Domains | ${{ steps.ping.outputs.total_domains || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Auto Timeout | ${{ steps.ping.outputs.auto_timeout || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Methods | HEAD, GET, POST, IFRAME, HEALTH |" >> $GITHUB_STEP_SUMMARY
